name: Deploy

# CD (D42): runs after the CI workflow finishes on master (via workflow_run),
# and only proceeds if CI was green. Build+push the image to GHCR tagged
# `latest` + `<sha>` (the sha tag is the rollback path), then SSH to the
# server and pull+recreate.
#
# workflow_run always targets the workflow's default-branch definition, so
# this file must be present on master to fire (not just the branch that last
# edited it). Every job checks out github.event.workflow_run.head_sha
# explicitly — that pins to the commit CI actually tested, since the
# workflow_run event's own ref/sha point at the CI run, not the code.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

env:
  IMAGE: ghcr.io/edgar-84/cashflow

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Add `platforms: linux/arm64` here if the server is a t4g
          # (Graviton/ARM) instance (D42) — omitted since the instance
          # type isn't decided yet; default is the runner's linux/amd64.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Compose file is code, not secret config — sync it from the repo on
      # every deploy so server-side config can never drift from master.
      # .env is deliberately NOT touched here: it's hand-written, holds
      # secrets, and is never checked into the repo.
      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "/opt/bot"

      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/bot
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
