# Production stack (AWS, deployed from master). No db service — DATABASE_URL
# in `.env` must point at Supabase's SESSION pooler (port 5432). Do NOT use
# the transaction pooler: it breaks asyncpg prepared statements (see plan
# Risks; if pgbouncer errors appear, set statement_cache_size=0 in the pool).
#
# Publishing (D40 + U1.5): only the `proxy` service (Caddy) publishes ports
# (80/443); the api still has no direct port exposure. The bot long-polls
# Telegram outbound and reaches the api over the internal compose network as
# http://api:8000. X-Internal-Token stays the bot's auth layer; the Mini App
# reaches the same api through Caddy over HTTPS (D213).
#
# `image` defaults to a local build (laptop prod-config test, D42); the
# server's .env sets CASHFLOW_IMAGE=ghcr.io/edgar-84/cashflow:latest so CD
# can `docker compose pull && up -d` without rebuilding.
#
# Run: docker compose -f docker-compose.prod.yml up -d --build

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  migrate:
    build: .
    image: ${CASHFLOW_IMAGE:-cashflow:prod}
    command: alembic upgrade head
    env_file: .env
    restart: "no"
    logging: *default-logging

  api:
    build: .
    image: ${CASHFLOW_IMAGE:-cashflow:prod}
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file: .env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  bot:
    build: .
    image: ${CASHFLOW_IMAGE:-cashflow:prod}
    command: python -m bot.bot
    env_file: .env
    environment:
      BACKEND_BASE_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging

  # TLS reverse proxy in front of the api (U1.5, D213). Caddy issues and
  # renews a Let's Encrypt cert for $MINI_APP_HOST automatically; renewal
  # state and cert material persist in the caddy_data volume across
  # `docker compose up -d --force-recreate`. See README "Mini App deployment".
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Public hostname (e.g. miniapp.example.com); Caddy will fail to issue a
      # cert if this is not a real, DNS-resolvable host it controls. A
      # placeholder default keeps `docker compose config` green on laptops
      # (AC) — do NOT ship a prod deploy without setting this in .env.
      MINI_APP_HOST: ${MINI_APP_HOST:-miniapp.example.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
